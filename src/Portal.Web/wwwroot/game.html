<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Разбор завала</title>

<!--
    Пасхалка портала. Открывается, если десять раз нажать на своё имя
    в правом верхнем углу.

    Страница нарочно самостоятельная: ни общих стилей, ни app.js, ни
    обращений к серверу. Так она не может ничего сломать в портале
    и не мешает его настройкам безопасности — здесь просто отдельный
    файл, который браузер открывает в новой вкладке.

    Игра про то, чем портал и занимается: с неба валятся документы,
    их надо разложить по папкам. Ловим папкой нужного цвета — точка;
    поймали не тем цветом или уронили — минус жизнь.
-->

<link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="/css/game.css" />
</head>
<body>

<h1>Разбор завала</h1>
<p class="sub">
  Сверху валятся документы. Двигайте папку мышью или стрелками
  и ловите тем цветом, который у документа. Не тем цветом или мимо — минус жизнь.
</p>

<div class="panel">
  <span>Разобрано: <b id="score">0</b></span>
  <span>Жизни: <b id="lives">3</b></span>
  <span>Уровень: <b id="level">1</b></span>
</div>

<canvas id="c" width="720" height="440"></canvas>

<p class="hint">Пробел — начать заново · стрелки влево-вправо или мышь — двигать папку · 1 2 3 — цвет папки</p>

<script src="/js/game.js"></script>
</body>
</html>
